name: Rates, fuel, lotto

on:
  schedule:
    # NBRM publishes tomorrow's list in the afternoon; Lotto 7 is drawn in the evening
    - cron: '0 6,15,21 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run:
    uses: ./.github/workflows/update.yml
    with:
      scripts: update-rates.mjs update-fuel.mjs update-lotto.mjs update-weather-live.mjs
